# Managed alongside Nginx Proxy Manager's custom HTTP configuration.
server {
  listen 80;
  listen [::]:80;
  server_name 3d-models.perinet.org;

  location ^~ /.well-known/acme-challenge/ {
    include conf.d/include/letsencrypt-acme-challenge.conf;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name 3d-models.perinet.org;

  ssl_certificate /etc/letsencrypt/live/3d-models-perinet-org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/3d-models-perinet-org/privkey.pem;
  include /etc/nginx/conf.d/include/ssl-ciphers.conf;

  location / {
    proxy_pass http://3d-models-perinet:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}
