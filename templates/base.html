<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ boot.site.title }}{% endblock %}</title>
  <meta name="description" content="{% if og %}{{ og.description }}{% else %}{{ boot.site.tagline }}{% endif %}">
  <meta name="theme-color" content="#0b0c11" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3.2 27.6 9.8 16 16.4 4.4 9.8Z' fill='%23c4c0ff'/%3E%3Cpath d='M4.4 9.8 16 16.4v12.9L4.4 22.7Z' fill='%236360f5'/%3E%3Cpath d='M27.6 9.8 16 16.4v12.9l11.6-6.6Z' fill='%237c4fe9'/%3E%3C/svg%3E">
  {% if og %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ boot.site.title }}">
  <meta property="og:title" content="{{ og.title }}">
  <meta property="og:description" content="{{ og.description }}">
  <meta property="og:image" content="{{ og.image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="{{ og.url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og.title }}">
  <meta name="twitter:description" content="{{ og.description }}">
  <meta name="twitter:image" content="{{ og.image }}">
  {% endif %}
  <link rel="stylesheet" href="{{ asset_url('css/app.css') }}">
  <script src="{{ asset_url('js/theme.js') }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include '_icons.html' %}
  {% block body %}{% endblock %}
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="application/json" id="boot">{{ boot|tojson }}</script>
  {% block scripts %}{% endblock %}
</body>
</html>
