{% extends 'base.html' %}
{% block title %}{% if og %}{{ og.title }} · {% endif %}{{ boot.site.title }}{% endblock %}
{% block body %}
<header class="topbar">
  <button type="button" id="menuButton" class="btn btn-ghost btn-icon mobile-only" aria-label="Kategoriler ve filtreler"><svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg></button>
  <a class="brand" href="/" aria-label="{{ boot.site.title }} ana sayfa">
    {% include '_brand.html' %}
    <span class="brand-text"><span class="brand-title">{{ boot.site.title }}</span><span class="brand-tagline">{{ boot.site.tagline }}</span></span>
  </a>
  <div class="search" role="search">
    <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
    <input id="search" class="search-input" type="search" placeholder="Model, kategori, etiket veya tasarımcı ara…" autocomplete="off" spellcheck="false" aria-label="Modellerde ara">
    <div class="search-hint">
      <button type="button" id="searchClear" class="search-clear" hidden aria-label="Aramayı temizle"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-x"></use></svg></button>
      <span class="kbd">Ctrl K</span>
    </div>
  </div>
  <div class="topbar-actions" id="topActions"></div>
</header>
<div class="layout" id="layout">
  <aside class="sidebar scroll-thin" id="sidebar" aria-label="Kategoriler ve filtreler"></aside>
  <main class="content" id="content" tabindex="-1"></main>
</div>
<dialog id="detailDialog" class="modal viewer-dialog" aria-label="Model detayı"><div class="modal-card" id="detailRoot"></div></dialog>
{% endblock %}
{% block scripts %}
{% include '_three.html' %}
<script type="module" src="{{ asset_url('js/app.js') }}"></script>
{% endblock %}
